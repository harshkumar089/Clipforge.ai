version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SERVER_URL=${SERVER_URL:-http://localhost:5000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
      - MONGODB_URI=mongodb://mongodb:27017/clipforge
      - JWT_SECRET=${JWT_SECRET:-clipforge_docker_jwt_production_secret_key_2026}
      - COOKIE_NAME=clipforge_auth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - THUMBNAIL_DIR=/app/thumbnails
      - MAX_VIDEO_DURATION=14400
      - MAX_FILE_SIZE=2147483648
    volumes:
      - clipforge_uploads:/app/uploads
      - clipforge_outputs:/app/outputs
      - clipforge_thumbnails:/app/thumbnails
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - clipforge_mongo:/data/db
    restart: unless-stopped

volumes:
  clipforge_uploads:
  clipforge_outputs:
  clipforge_thumbnails:
  clipforge_mongo:
